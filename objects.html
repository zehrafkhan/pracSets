<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function LibraryBook(title,author){
            this.title = title;
            this.author = author;
            this.isAvailable = true;

            this.toggleAvailiblity = function(){
                this.isAvailable = !this.isAvailable;
            }
            this.getstatus = function(){
                return this.isAvailable? "Available" : "checked out"
            }
        };
        let book = new LibraryBook("Alchemist", "paulo")
        console.log(book.getstatus());
        book.toggleAvailiblity()
         console.log(book.getstatus());
    </script>
</body>
</html>
