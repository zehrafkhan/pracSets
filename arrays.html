<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array operations</title>
</head>
<body>
    <input type="text" id="taskInput" placeholder="Add Task">  
    <button onclick="addTask()">Add Task</button>
    <input type="text" id="searchInput" placeholder="Search Task">
    <button onclick="searchTask()">Search Task</button>
    <ul id="taskList"></ul>

    <script>
        var tasks = []
        function addTask(){
            var taskInput = document.getElementById("taskInput").value;
            tasks.push(taskInput);
            displayTasks();
        }
        function searchTask(){
            var searchInput = document.getElementById("searchInput").value.toLowerCase();
            var filteredTasks = tasks.filter(task => task.toLowerCase().includes(searchInput));
            displayTasks(filteredTasks);
        }

        function displayTasks(taskArray = tasks){
            var taskList = document.getElementById("taskList");
            taskList.innerHTML = "";
            taskArray.forEach(function(task){
                var li = document.createElement("li");
                li.textContent = task;
                taskList.appendChild(li);
            });
        }
    </script>
</body>
</html>
