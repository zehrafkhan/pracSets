<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <title>Focus Timer</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #0b1020;
            color: #f5f7ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: 24px;
            background:
                radial-gradient(ellipse at 18% 18%, rgba(97, 79, 220, 0.22), transparent 36%),
                radial-gradient(ellipse at 84% 82%, rgba(38, 201, 173, 0.12), transparent 34%),
                #0b1020;
        }

        .timer-card {
            position: relative;
            width: min(100%, 440px);
            padding: 38px 34px 32px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            background: linear-gradient(145deg, rgba(26, 34, 59, 0.96), rgba(17, 23, 42, 0.96));
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.48), inset 0 1px rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .timer-card::before {
            position: absolute;
            top: -130px;
            left: 50%;
            width: 280px;
            height: 220px;
            border-radius: 50%;
            background: rgba(113, 96, 255, 0.18);
            content: "";
            filter: blur(65px);
            pointer-events: none;
            transform: translateX(-50%);
        }

        .eyebrow {
            position: relative;
            margin: 0 0 14px;
            color: #a9a6ff;
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        h1 {
            position: relative;
            margin: 0;
            font-size: clamp(1.8rem, 7vw, 2.35rem);
            font-weight: 650;
            letter-spacing: -0.055em;
        }

        .subtitle {
            position: relative;
            margin: 10px 0 30px;
            color: #9ca6bf;
            font-size: 0.95rem;
        }

        .timer-face {
            position: relative;
            display: grid;
            width: 230px;
            aspect-ratio: 1;
            margin: 0 auto 25px;
            place-items: center;
        }

        .timer-face svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            transform: rotate(-90deg);
        }

        .ring-track,
        .ring-progress {
            fill: none;
            stroke-width: 8;
        }

        .ring-track {
            stroke: rgba(255, 255, 255, 0.08);
        }

        .ring-progress {
            stroke: url("#ring-gradient");
            stroke-dasharray: 552.92;
            stroke-dashoffset: 0;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(91, 231, 202, 0.38));
            transition: stroke-dashoffset 0.5s ease;
        }

        .time-content {
            display: grid;
            gap: 5px;
        }

        #timer {
            font-variant-numeric: tabular-nums;
            font-size: clamp(4.3rem, 18vw, 5.4rem);
            font-weight: 650;
            letter-spacing: -0.08em;
            line-height: 1;
        }

        .time-label {
            color: #9ca6bf;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.17em;
            text-transform: uppercase;
        }

        .status {
            min-height: 1.4em;
            margin: 0 0 22px;
            color: #b7c0d5;
            font-size: 0.9rem;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            min-height: 52px;
            border: 0;
            border-radius: 15px;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 3px solid #f5f7ff;
            outline-offset: 3px;
        }

        .start-button {
            flex: 1;
            color: #081915;
            background: linear-gradient(110deg, #72efd1, #a0f3bd);
            box-shadow: 0 8px 24px rgba(89, 223, 189, 0.2);
        }

        .start-button:hover {
            box-shadow: 0 10px 30px rgba(89, 223, 189, 0.32);
        }

        .reset-button {
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.11);
            color: #d9deeb;
            background: rgba(255, 255, 255, 0.055);
        }

        .reset-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 420px) {
            body {
                padding: 16px;
            }

            .timer-card {
                padding: 32px 22px 24px;
                border-radius: 24px;
            }

            .timer-face {
                width: min(210px, 65vw);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="timer-card">
        <p class="eyebrow">A little time for you</p>
        <h1>Focus Timer</h1>
        <p class="subtitle">Take a breath. Make this moment count.</p>

        <div class="timer-face" aria-label="Countdown timer">
            <svg viewBox="0 0 200 200" aria-hidden="true">
                <defs>
                    <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#a0f3bd" />
                        <stop offset="100%" stop-color="#65e4d0" />
                    </linearGradient>
                </defs>
                <circle class="ring-track" cx="100" cy="100" r="88"></circle>
                <circle class="ring-progress" id="progressRing" cx="100" cy="100" r="88"></circle>
            </svg>
            <div class="time-content">
                <span id="timer" role="timer" aria-live="off">00:10</span>
                <span class="time-label">seconds</span>
            </div>
        </div>

        <p class="status" id="status" aria-live="polite">Ready when you are</p>
        <div class="controls">
            <button class="start-button" type="button" onclick="StartCountdown()">Start countdown</button>
            <button class="reset-button" type="button" onclick="StopCountdown()">Reset</button>
        </div>
    </main>

    <script>
        var countDownIntervel;
        var remainingTime = 10;
        var timerDuration = 10;
        var ringCircumference = 2 * Math.PI * 88;

        function StartCountdown() {
            clearInterval(countDownIntervel);
            updateRemainingTime();
            document.getElementById("status").textContent = "You’ve got this";
            countDownIntervel = setInterval(function () {
                remainingTime = Math.max(0, remainingTime - 1);
                updateRemainingTime();
                if (remainingTime <= 0) {
                    clearInterval(countDownIntervel);
                    document.getElementById("status").textContent = "Time is up. Well done!";
                }
            }, 1000);
        }

        function StopCountdown() {
            clearInterval(countDownIntervel);
            remainingTime = timerDuration;
            document.getElementById("status").textContent = "Ready when you are";
            updateRemainingTime();
        }

        function updateRemainingTime() {
            var minutes = Math.floor(remainingTime / 60);
            var seconds = remainingTime % 60;
            document.getElementById("timer").textContent =
                String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
            document.getElementById("progressRing").style.strokeDashoffset =
                ringCircumference * (1 - remainingTime / timerDuration);
        }
    </script>
</body>
</html>
